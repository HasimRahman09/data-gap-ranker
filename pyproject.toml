[project]
name = "data-gap-ranker"
version = "0.0.1"
description = "Rank which single missing SDG series would unlock the most country comparisons. Not an official UN product."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["typer>=0.12"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
gapranker = "gapranker.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gapranker"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.mypy]
strict = true
files = ["src"]
